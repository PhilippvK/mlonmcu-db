# version: "3.9"
services:
  explorer:
    profiles: [explorer]
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT: http://garage:3900
    ports:
      - "127.0.0.1:${EXPLORER_PORT:-8080}:8080"
    depends_on:
      - postgres
      - garage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: mlonmcu-db-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  garage:
    image: dxflrs/garage:v2.0.0
    container_name: mlonmcu-db-garage
    restart: unless-stopped
    env_file: .env
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC
      - "3902:3902"   # ?
      - "3903:3903"   # ?
    volumes:
      # - garage-data:/var/lib/garage/data
      # - garage-meta:/var/lib/garage/meta
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml

  webui:
    image: khairul169/garage-webui:latest
    container_name: mlonmcu-db-webui
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    env_file: .env
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "3909:3909"

volumes:
  postgres-data:
  # garage-data:
  # garage-meta:
